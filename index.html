<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 판 놀이방</title>
<meta name="description" content="설치도 로그인도 없이 브라우저에서 바로 두는 보드게임 놀이방. 리버시 · 오목 · 윷놀이를 AI와, 한 화면에서, 초대 링크로 친구와.">
<meta property="og:title" content="한 판 놀이방">
<meta property="og:description" content="설치도 로그인도 없이 브라우저에서 바로 두는 보드게임 놀이방. 리버시 · 오목 · 윷놀이를 AI와, 한 화면에서, 초대 링크로 친구와.">
<meta property="og:type" content="website">
<meta property="og:image" content="reversi/thumb.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/site.css">
<style>
  html { color-scheme: light dark; }
  [hidden] { display: none !important; }

  :root {
    --ground: #ECEEF0;
    --surface: #F7F8F9;
    --ink: #171B20;
    --ink-soft: #57616D;
    --line: #C9CFD6;
    --accent: #B4431F;
    --on-ink: #F7F8F9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101316;
      --surface: #191D22;
      --ink: #E5E9ED;
      --ink-soft: #96A1AD;
      --line: #2B323A;
      --accent: #F08A5D;
      --on-ink: #101316;
    }
  }
  :root[data-theme="dark"] {
    --ground: #101316;
    --surface: #191D22;
    --ink: #E5E9ED;
    --ink-soft: #96A1AD;
    --line: #2B323A;
    --accent: #F08A5D;
    --on-ink: #101316;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 1rem/1.6 "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  .page {
    max-width: 1040px;
    margin-inline: auto;
    padding-inline: 16px;
    padding-block: 36px 56px;
    display: grid;
    gap: 36px;
  }
  .masthead { display: grid; gap: 6px; }
  h1 {
    margin: 0;
    font: 400 3rem/1.05 "Black Han Sans", "Gothic A1", "Apple SD Gothic Neo", sans-serif;
    letter-spacing: 0.01em;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .masthead p { margin: 0; color: var(--ink-soft); max-width: 36em; }

  .games {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
  }
  .game { display: grid; gap: 14px; align-content: start; }
  .game a.board {
    display: block;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25), 0 12px 24px rgba(0, 0, 0, 0.16);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .game a.board img { display: block; width: 100%; height: auto; aspect-ratio: 1; }
  @media (hover: hover) {
    .game a.board:hover { transform: translateY(-4px); box-shadow: 0 7px 0 rgba(0, 0, 0, 0.22), 0 18px 30px rgba(0, 0, 0, 0.2); }
  }
  .game a:focus-visible, .btn:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .game-text { display: grid; gap: 6px; }
  .game h2 { margin: 0; font: 400 1.6rem/1.2 "Black Han Sans", "Gothic A1", sans-serif; }
  .game h2 a { color: inherit; text-decoration: none; }
  .game p { margin: 0; color: var(--ink-soft); font-size: 0.9375rem; }
  .meta { font-size: 0.8125rem; color: var(--ink-soft); }
  .go {
    justify-self: start;
    margin-top: 4px;
    padding: 9px 18px;
    border-radius: 4px;
    background: var(--ink);
    color: var(--on-ink);
    font-weight: 700;
    font-size: 0.875rem;
    text-decoration: none;
  }
  @media (max-width: 760px) {
    h1 { font-size: 2.3rem; }
    .games { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .game { grid-template-columns: 112px minmax(0, 1fr); gap: 16px; align-items: start; }
    .game h2 { font-size: 1.35rem; }
  }

  /* 초대 코드로 참가 */
  .joinbox {
    display: grid;
    gap: 12px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
  }
  .joinbox h2 { margin: 0; font-size: 1rem; font-weight: 700; }
  .joinbox p { margin: 0; font-size: 0.875rem; color: var(--ink-soft); max-width: 40em; }
  .join-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .seg-row {
    display: flex;
    flex-wrap: wrap;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface);
  }
  .seg-row input { position: absolute; opacity: 0; pointer-events: none; }
  .seg-row label { padding: 9px 14px; font-size: 0.875rem; cursor: pointer; white-space: nowrap; }
  .seg-row label + input + label { border-left: 1px solid var(--line); }
  .seg-row input:checked + label { background: var(--ink); color: var(--on-ink); font-weight: 700; }
  .seg-row input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: -3px; }
  #code {
    width: 11.5rem;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
    color: var(--ink);
    font: 700 1rem/1.2 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  #code::placeholder { letter-spacing: 0; color: var(--ink-soft); font: 400 0.875rem "Gothic A1", system-ui, sans-serif; }
  #code:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .btn {
    appearance: none;
    padding: 9px 20px;
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: transparent;
    color: var(--ink);
    font: 700 0.875rem/1.2 "Gothic A1", system-ui, sans-serif;
    cursor: pointer;
  }
  #join-msg { min-height: 1.4em; color: var(--ink); font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    .game a.board { transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <h1><em>한 판</em> 놀이방</h1>
    <p>혼자서는 AI와, 같이 있으면 한 화면에서, 떨어져 있으면 초대 링크로. 설치도 로그인도 없이 바로 한 판 둡니다.</p>
  </header>

  <ul class="games" id="games"></ul>

  <div class="ad-slot" data-ad="hub-bottom" hidden></div>

  <section class="joinbox" aria-labelledby="join-title">
    <h2 id="join-title">초대 코드로 참가</h2>
    <p>친구가 방을 만들고 6자리 코드를 알려 줬다면, 게임을 고르고 코드를 넣으세요. 초대 링크를 받았다면 링크만 누르면 됩니다.</p>
    <div class="join-row">
      <div class="seg-row" role="radiogroup" aria-label="게임" id="join-games"></div>
      <input type="text" id="code" maxlength="6" placeholder="방 코드 6자리" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="방 코드">
      <button type="button" class="btn" id="join">참가</button>
    </div>
    <p id="join-msg" role="status"></p>
  </section>
</div>

<script src="shared/config.js"></script>
<script src="games.js"></script>
<script src="shared/site.js"></script>
<script>
(() => {
  const GAMES = window.HANPAN_GAMES || [];
  const urlOf = g => g.id + '/index.html';
  const el = (tag, props, ...kids) => {
    const n = document.createElement(tag);
    Object.assign(n, props || {});
    n.append(...kids);
    return n;
  };

  // ---------- 게임 목록 ----------
  const list = document.getElementById('games');
  for (const g of GAMES) {
    const thumb = el('a', { className: 'board', href: urlOf(g) },
      el('img', { src: g.id + '/thumb.svg', alt: '', width: 300, height: 300, loading: 'lazy' }));
    thumb.setAttribute('aria-label', g.title + ' 시작하기');
    list.appendChild(el('li', { className: 'game' },
      thumb,
      el('div', { className: 'game-text' },
        el('h2', null, el('a', { href: urlOf(g), textContent: g.title })),
        el('p', { textContent: g.blurb }),
        el('span', { className: 'meta', textContent: g.meta }),
        el('a', { className: 'go', href: urlOf(g), textContent: '시작하기' }))));
  }

  // ---------- 초대 코드로 참가 ----------
  const seg = document.getElementById('join-games');
  GAMES.filter(g => g.online).forEach((g, i) => {
    const input = el('input', { type: 'radio', name: 'join-game', id: 'jg-' + g.id, value: g.id, checked: i === 0 });
    const label = el('label', { htmlFor: 'jg-' + g.id, textContent: g.title });
    seg.append(input, label);
  });
  const codeEl = document.getElementById('code'), msg = document.getElementById('join-msg');
  function join() {
    const code = codeEl.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 6) { msg.textContent = '방 코드 6자리를 입력해 주세요.'; codeEl.focus(); return; }
    const picked = document.querySelector('input[name="join-game"]:checked');
    const game = GAMES.find(g => picked && g.id === picked.value);
    if (game) location.href = urlOf(game) + '?room=' + code;
  }
  document.getElementById('join').addEventListener('click', join);
  codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
})();
</script>
</body>
</html>
